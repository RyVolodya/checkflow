services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: checkflow
      POSTGRES_USER: checkflow
      POSTGRES_PASSWORD: checkflow
    volumes:
      - checkflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkflow -d checkflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://checkflow:checkflow@db:5432/checkflow?schema=public
      JWT_SECRET: change-this-secret-in-production
      PORT: 4000
      UPLOAD_DIR: /app/uploads
      BOOTSTRAP_USERNAME: Manager
      BOOTSTRAP_PASSWORD: manager
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - checkflow_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  checkflow_db:
  checkflow_uploads:
